<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Guardiões 3.0</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
</head>
<body>
    <!-- Top Action Bar -->
    <div class="action-bar no-print">
        <div class="action-group">
            <button id="btn-edit-mode" class="btn btn-primary">🛡️ Edição: OFF</button>
            <div class="color-picker-container">
                <input type="color" id="primary-color" value="#5c1a1b" title="Cor Tema">
            </div>
        </div>
        <div class="action-group">
            <button id="btn-save" class="btn">💾 Salvar Local</button>
            <button id="btn-share-link" class="btn btn-highlight">🔗 Gerar Link</button>
        </div>
        <div class="action-group">
            <button id="btn-copy-clipboard" class="btn">📋 Copiar Dados</button>
            <button id="btn-paste-clipboard" class="btn">📥 Colar Dados</button>
        </div>
        <div class="action-group">
            <button id="btn-export-json" class="btn">⬇️ Backup .json</button>
            <label for="file-upload" class="btn file-btn">⬆️ Carregar .json</label>
            <input type="file" id="file-upload" accept=".json" style="display:none;">
            <button id="btn-export-pdf" class="btn">🖨️ PDF</button>
        </div>
    </div>

    <!-- Main Layout: Sidebar + Content -->
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar no-print">
            <div class="sidebar-header">
                <h3>MENU</h3>
            </div>
            <button class="tab-btn active" data-target="tab-perfil">🤳 -Perfil-</button>
            <button class="tab-btn" data-target="tab-status">♥️ -Status-</button>
            <button class="tab-btn" data-target="tab-habilidades">⚜️ -Habilidades-</button>
            <button class="tab-btn" data-target="tab-poderes">🔥 -Poderes-</button>
            <button class="tab-btn" data-target="tab-magias">🧙 -Magias-</button>
            <button class="tab-btn" data-target="tab-rituais">☸️ -Rituais-</button>
            <button class="tab-btn" data-target="tab-transformacoes">☠️ -Transformações-</button>
            <button class="tab-btn" data-target="tab-pactos">👿 -Pactos-</button>
            <button class="tab-btn" data-target="tab-diario">📝 -Diário-</button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" id="sheet-container">
            <header class="sheet-header">
                <input type="text" class="editable-label title-input" value="FICHA GUARDIÕES 3.0" id="main-title" readonly>
            </header>

            <!-- ABA: PERFIL -->
            <div id="tab-perfil" class="tab-content active">
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="PERFIL" readonly></div>
                    <div class="panel-body profile-grid">
                        <div class="field"><input type="text" class="editable-label" value="Nome:" readonly><input type="text" class="value-input" id="perfil-nome"></div>
                        <div class="field"><input type="text" class="editable-label" value="Título:" readonly><input type="text" class="value-input" id="perfil-titulo"></div>
                        <div class="field"><input type="text" class="editable-label" value="Idade:" readonly><input type="text" class="value-input" id="perfil-idade"></div>
                        <div class="field"><input type="text" class="editable-label" value="Altura:" readonly><input type="text" class="value-input" id="perfil-altura"></div>
                        <div class="field"><input type="text" class="editable-label" value="Origem/Raça:" readonly><input type="text" class="value-input" id="perfil-raca"></div>
                        <div class="field"><input type="text" class="editable-label" value="Classe/Trilha:" readonly><input type="text" class="value-input" id="perfil-classe"></div>
                        <div class="field"><input type="text" class="editable-label" value="Nível:" readonly><input type="number" class="value-input number-input" id="perfil-nivel" value="1"></div>
                        <div class="field"><input type="text" class="editable-label" value="Proficiência Base:" readonly><input type="number" class="value-input number-input" id="perfil-proficiencia" value="2"></div>
                    </div>
                </section>
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="HISTÓRIA DO PERSONAGEM" readonly></div>
                    <div class="panel-body">
                        <textarea class="value-input textarea-huge" id="perfil-historia" placeholder="Escreva a história do seu personagem..."></textarea>
                    </div>
                </section>
            </div>

            <!-- ABA: STATUS -->
            <div id="tab-status" class="tab-content">
                <div class="grid-layout">
                    <div class="col-left">
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="RECURSOS DE COMBATE" readonly></div>
                            <div class="panel-body combat-grid">
                                <div class="stat-box">
                                    <input type="text" class="editable-label stat-label" value="Vida (HP)" readonly>
                                    <div class="stat-values">
                                        <input type="number" class="value-input number-input stat-curr" id="stat-hp-curr" value="10"> / 
                                        <input type="number" class="value-input number-input stat-max" id="stat-hp-max" value="10">
                                    </div>
                                </div>
                                <div class="stat-box">
                                    <input type="text" class="editable-label stat-label" value="Poder (PP)" readonly>
                                    <div class="stat-values">
                                        <input type="number" class="value-input number-input stat-curr" id="stat-pp-curr" value="5"> / 
                                        <input type="number" class="value-input number-input stat-max" id="stat-pp-max" value="5">
                                    </div>
                                </div>
                                <div class="stat-box">
                                    <input type="text" class="editable-label stat-label" value="Arcana (MP)" readonly>
                                    <div class="stat-values">
                                        <input type="number" class="value-input number-input stat-curr" id="stat-mp-curr" value="5"> / 
                                        <input type="number" class="value-input number-input stat-max" id="stat-mp-max" value="5">
                                    </div>
                                </div>
                                <div class="defense-grid">
                                    <div class="field"><input type="text" class="editable-label" value="Classe de Armadura:" readonly><input type="number" class="value-input number-input" id="combat-ca" value="10"></div>
                                    <div class="field"><input type="text" class="editable-label" value="Deslocamento:" readonly><input type="text" class="value-input" id="combat-deslocamento"></div>
                                    <div class="field"><input type="text" class="editable-label" value="Reações:" readonly><input type="number" class="value-input number-input" id="combat-reacoes" value="1"></div>
                                </div>
                                <textarea class="value-input textarea-large" id="combat-resistencias" placeholder="Resistências, Imunidades, Fraquezas..."></textarea>
                            </div>
                        </section>
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="INVENTÁRIO E EQUIPAMENTO" readonly></div>
                            <div class="panel-body">
                                <div class="encumbrance-bar">
                                    <input type="text" class="editable-label" value="Carga Max:" readonly>
                                    <span class="calc-value" id="calc-carga-max">5</span>
                                    <span class="helper-text">(5 + Força + Vigor)</span>
                                </div>
                                <div class="slots-grid">
                                    <div class="slot-field"><input type="text" class="editable-label" value="Cabeça (0/1):" readonly><input type="text" class="value-input slot-input" id="inv-cabeca"></div>
                                    <div class="slot-field"><input type="text" class="editable-label" value="Olhos (0/2):" readonly><input type="text" class="value-input slot-input" id="inv-olhos"></div>
                                    <div class="slot-field"><input type="text" class="editable-label" value="Orelhas (0/2):" readonly><input type="text" class="value-input slot-input" id="inv-orelhas"></div>
                                    <div class="slot-field"><input type="text" class="editable-label" value="Pescoço (0/3):" readonly><input type="text" class="value-input slot-input" id="inv-pescoco"></div>
                                    <div class="slot-field"><input type="text" class="editable-label" value="Tronco (0/1):" readonly><input type="text" class="value-input slot-input" id="inv-tronco"></div>
                                    <div class="slot-field"><input type="text" class="editable-label" value="Corpo (0/3):" readonly><input type="text" class="value-input slot-input" id="inv-corpo"></div>
                                    <div class="slot-field"><input type="text" class="editable-label" value="Pulso (0/4):" readonly><input type="text" class="value-input slot-input" id="inv-pulso"></div>
                                    <div class="slot-field"><input type="text" class="editable-label" value="Mãos (0/2):" readonly><input type="text" class="value-input slot-input" id="inv-maos"></div>
                                    <div class="slot-field"><input type="text" class="editable-label" value="Pés (0/1):" readonly><input type="text" class="value-input slot-input" id="inv-pes"></div>
                                </div>
                                <div class="inventory-box">
                                    <input type="text" class="editable-label" value="Mochila / Itens Livres:" readonly>
                                    <textarea class="value-input textarea-large" id="inv-mochila" placeholder="Escreva aqui seus itens..."></textarea>
                                </div>
                                <div class="wallet-grid">
                                    <div class="wallet-item"><input type="text" class="editable-label" value="Créditos:" readonly><input type="number" class="value-input number-input" id="coin-creditos" value="0"></div>
                                    <div class="wallet-item"><input type="text" class="editable-label" value="Prata:" readonly><input type="number" class="value-input number-input" id="coin-prata" value="0"></div>
                                    <div class="wallet-item"><input type="text" class="editable-label" value="Ouro:" readonly><input type="number" class="value-input number-input" id="coin-ouro" value="0"></div>
                                </div>
                            </div>
                        </section>
                    </div>
                    <div class="col-right">
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="ATRIBUTOS E PERÍCIAS" readonly></div>
                            <div class="panel-body attrs-container" id="attributes-container">
                                <!-- Injetado via JS -->
                            </div>
                        </section>
                    </div>
                </div>
            </div>

            <!-- ABA: HABILIDADES -->
            <div id="tab-habilidades" class="tab-content">
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="-Habilidades-" readonly></div>
                    <div class="panel-body"><textarea class="value-input textarea-large" id="text-habilidades-gerais"></textarea></div>
                </section>
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="-Habilidades passivas-" readonly></div>
                    <div class="panel-body"><textarea class="value-input textarea-large" id="text-habilidades-passivas"></textarea></div>
                </section>
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="-Habilidades De Trilha-" readonly></div>
                    <div class="panel-body"><textarea class="value-input textarea-large" id="text-habilidades-trilha"></textarea></div>
                </section>
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="-Habilidades De Reação-" readonly></div>
                    <div class="panel-body"><textarea class="value-input textarea-large" id="text-habilidades-reacao"></textarea></div>
                </section>
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="-Habilidades da Raça-" readonly></div>
                    <div class="panel-body"><textarea class="value-input textarea-large" id="text-habilidades-raca"></textarea></div>
                </section>
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="-Habilidades da MARCA-" readonly></div>
                    <div class="panel-body"><textarea class="value-input textarea-large" id="text-habilidades-marca"></textarea></div>
                </section>
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="-Habilidades de Acampamento-" readonly></div>
                    <div class="panel-body"><textarea class="value-input textarea-large" id="text-habilidades-acampamento"></textarea></div>
                </section>
            </div>

            <!-- ABA: PODERES -->
            <div id="tab-poderes" class="tab-content">
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="-Poderes-" readonly></div>
                    <div class="panel-body"><textarea class="value-input textarea-huge" id="text-poderes-gerais"></textarea></div>
                </section>
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="-Poderes Exclusivos-" readonly></div>
                    <div class="panel-body"><textarea class="value-input textarea-huge" id="text-poderes-exclusivos"></textarea></div>
                </section>
            </div>

            <!-- ABA: MAGIAS -->
            <div id="tab-magias" class="tab-content">
                <div class="grid-layout">
                    <div class="col-left">
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="Nível 1" readonly></div>
                            <div class="panel-body"><textarea class="value-input textarea-large" id="text-magias-l1"></textarea></div>
                        </section>
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="Nível 2" readonly></div>
                            <div class="panel-body"><textarea class="value-input textarea-large" id="text-magias-l2"></textarea></div>
                        </section>
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="Nível 3" readonly></div>
                            <div class="panel-body"><textarea class="value-input textarea-large" id="text-magias-l3"></textarea></div>
                        </section>
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="Nível 4" readonly></div>
                            <div class="panel-body"><textarea class="value-input textarea-large" id="text-magias-l4"></textarea></div>
                        </section>
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="Nível 5" readonly></div>
                            <div class="panel-body"><textarea class="value-input textarea-large" id="text-magias-l5"></textarea></div>
                        </section>
                    </div>
                    <div class="col-right">
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="Nível 6" readonly></div>
                            <div class="panel-body"><textarea class="value-input textarea-large" id="text-magias-l6"></textarea></div>
                        </section>
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="Nível 7" readonly></div>
                            <div class="panel-body"><textarea class="value-input textarea-large" id="text-magias-l7"></textarea></div>
                        </section>
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="Nível 8" readonly></div>
                            <div class="panel-body"><textarea class="value-input textarea-large" id="text-magias-l8"></textarea></div>
                        </section>
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="Nível 9" readonly></div>
                            <div class="panel-body"><textarea class="value-input textarea-large" id="text-magias-l9"></textarea></div>
                        </section>
                    </div>
                </div>
            </div>

            <!-- ABA: RITUAIS -->
            <div id="tab-rituais" class="tab-content">
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="RITUAIS" readonly></div>
                    <div class="panel-body">
                        <textarea class="value-input textarea-huge" id="text-rituais" placeholder="Descreva rituais místicos..."></textarea>
                    </div>
                </section>
            </div>

            <!-- ABA: TRANSFORMACOES -->
            <div id="tab-transformacoes" class="tab-content">
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="TRANSFORMAÇÕES" readonly></div>
                    <div class="panel-body">
                        <textarea class="value-input textarea-huge" id="text-transformacoes" placeholder="Formas alternativas, Besta, Licantropia, etc..."></textarea>
                    </div>
                </section>
            </div>

            <!-- ABA: PACTOS -->
            <div id="tab-pactos" class="tab-content">
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="PACTOS" readonly></div>
                    <div class="panel-body">
                        <textarea class="value-input textarea-huge" id="text-pactos" placeholder="Pactos com entidades, dívidas, etc..."></textarea>
                    </div>
                </section>
            </div>

            <!-- ABA: DIARIO -->
            <div id="tab-diario" class="tab-content">
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="DIÁRIO E ANOTAÇÕES" readonly></div>
                    <div class="panel-body">
                        <textarea class="value-input textarea-huge" id="text-diario" placeholder="Anotações da campanha..."></textarea>
                    </div>
                </section>
            </div>
            
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
