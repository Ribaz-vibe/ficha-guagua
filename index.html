<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Guardiões 3.0</title>
    <link rel="stylesheet" href="styles.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
</head>
<body>
    
    <!-- Floating Buttons -->
    <button id="btn-toggle-menu" class="floating-btn sys-btn" title="Menu de Sistema">⚙️</button>
    <button id="btn-toggle-scratchpad" class="floating-btn scratch-btn" title="Bloco de Notas">📝</button>

    <!-- System Menu (Drawer) -->
    <nav id="system-menu" class="system-menu">
        <div class="menu-header">
            <h3>SISTEMA</h3>
            <button id="btn-close-menu" class="close-btn">✖</button>
        </div>
        
        <div class="menu-section">
            <h4>Sessão</h4>
            <button id="btn-play-mode" class="btn btn-highlight">⚔️ Modo Jogo: OFF</button>
            <button id="btn-edit-mode" class="btn btn-primary">🛡️ Modo Edição: OFF</button>
        </div>
        
        <div class="menu-section">
            <h4>Arquivos & Compartilhamento</h4>
            <button id="btn-save" class="btn">💾 Salvar Localmente</button>
            <div class="auto-save-control">
                <label for="auto-save-select">Auto-Save:</label>
                <select id="auto-save-select">
                    <option value="0">Desligado</option>
                    <option value="5">5 Minutos</option>
                    <option value="10">10 Minutos</option>
                </select>
            </div>
            
            <button id="btn-share-link" class="btn btn-highlight">🔗 Gerar Link Mágico</button>
            
            <div class="split-btns">
                <button id="btn-copy-clipboard" class="btn">📋 Copiar</button>
                <button id="btn-paste-clipboard" class="btn">📥 Colar</button>
            </div>
            
            <button id="btn-export-json" class="btn">⬇️ Baixar Backup (.json)</button>
            <label for="file-upload" class="btn file-btn">⬆️ Carregar Backup (.json)</label>
            <input type="file" id="file-upload" accept=".json" style="display:none;">
            
            <button id="btn-export-pdf" class="btn">🖨️ Exportar para PDF</button>
        </div>

        <div class="menu-section">
            <h4>Customização</h4>
            <div class="color-picker-container">
                <label for="primary-color">Cor Tema:</label>
                <input type="color" id="primary-color" value="#7a1d1e" title="Cor Tema">
            </div>
        </div>
        
        <div class="menu-section">
            <button id="btn-new-sheet" class="btn btn-danger">⚠️ Nova Ficha Vazia</button>
        </div>
    </nav>

    <!-- Scratchpad (Floating) -->
    <div id="scratchpad" class="scratchpad hidden no-print">
        <div class="scratchpad-header">
            <span>Anotações Rápidas</span>
            <button id="btn-close-scratchpad" class="close-btn">✖</button>
        </div>
        <textarea id="scratchpad-text" placeholder="Escreva iniciativa, danos temporários..."></textarea>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container no-print"></div>

    <!-- Play HUD (Floating Top Bar) -->
    <div id="play-hud" class="play-hud hidden no-print">
        <div class="hud-item hp-hud">
            <span class="hud-label">HP</span>
            <input type="number" class="hud-input" id="hud-hp-curr" value="10">
            <span class="hud-sep">/</span>
            <span class="hud-max" id="hud-hp-max">10</span>
        </div>
        <div class="hud-item pp-hud">
            <span class="hud-label">PP</span>
            <input type="number" class="hud-input" id="hud-pp-curr" value="5">
            <span class="hud-sep">/</span>
            <span class="hud-max" id="hud-pp-max">5</span>
        </div>
        <div class="hud-item mp-hud">
            <span class="hud-label">MP</span>
            <input type="number" class="hud-input" id="hud-mp-curr" value="5">
            <span class="hud-sep">/</span>
            <span class="hud-max" id="hud-mp-max">5</span>
        </div>
    </div>

    <!-- Main Layout: Sidebar + Content -->
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar no-print">
            <div class="sidebar-header">
                <h3>MENU</h3>
            </div>
            <button class="tab-btn active" data-target="tab-perfil">🤳 -Perfil-</button>
            <button class="tab-btn" data-target="tab-status">♥️ -Status-</button>
            <button class="tab-btn" data-target="tab-habilidades">⚜️ -Habilidades-</button>
            <button class="tab-btn" data-target="tab-poderes">🔥 -Poderes-</button>
            <button class="tab-btn" data-target="tab-magias">🧙 -Magias-</button>
            <button class="tab-btn" data-target="tab-rituais">☸️ -Rituais-</button>
            <button class="tab-btn" data-target="tab-transformacoes">☠️ -Transformações-</button>
            <button class="tab-btn" data-target="tab-pactos">👿 -Pactos-</button>
            <button class="tab-btn" data-target="tab-inventario">🎒 -Inventário-</button>
            <button class="tab-btn" data-target="tab-diario">📝 -Diário-</button>
            
            <div id="custom-tabs-container"></div>
            <button id="btn-add-tab" class="btn btn-highlight edit-only-ui" style="margin-top: 15px; width: 100%;">➕ Nova Aba</button>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" id="sheet-container">
            <header class="sheet-header">
                <input type="text" class="editable-label title-input" value="FICHA GUARDIÕES 3.0" id="main-title" readonly>
            </header>

            <!-- ABA: PERFIL -->
            <div id="tab-perfil" class="tab-content active">
                <div class="profile-layout">
                    <div class="profile-col-img">
                        <div class="portrait-container">
                            <img id="char-portrait" src="" alt="?">
                            <input type="file" id="portrait-upload" accept="image/*" style="display:none;">
                            <label for="portrait-upload" class="portrait-overlay">📸 Mudar Imagem</label>
                        </div>
                    </div>
                    <div class="profile-col-info">
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="PERFIL" readonly></div>
                            <div class="panel-body profile-grid">
                                <div class="field"><input type="text" class="editable-label" value="Nome:" readonly><input type="text" class="value-input" id="perfil-nome"></div>
                                <div class="field"><input type="text" class="editable-label" value="Título:" readonly><input type="text" class="value-input" id="perfil-titulo"></div>
                                <div class="field"><input type="text" class="editable-label" value="Idade:" readonly><input type="text" class="value-input" id="perfil-idade"></div>
                                <div class="field"><input type="text" class="editable-label" value="Altura:" readonly><input type="text" class="value-input" id="perfil-altura"></div>
                                <div class="field"><input type="text" class="editable-label" value="Origem/Raça:" readonly><input type="text" class="value-input" id="perfil-raca"></div>
                                <div class="field"><input type="text" class="editable-label" value="Classe/Trilha:" readonly><input type="text" class="value-input" id="perfil-classe"></div>
                                <div class="field"><input type="text" class="editable-label" value="Nível:" readonly><input type="number" class="value-input number-input" id="perfil-nivel" value="1"></div>
                                <div class="field"><input type="text" class="editable-label" value="Proficiência Base:" readonly><input type="number" class="value-input number-input" id="perfil-proficiencia" value="2"></div>
                            </div>
                        </section>
                    </div>
                </div>
                <section class="panel">
                    <div class="panel-header"><input type="text" class="editable-label" value="HISTÓRIA DO PERSONAGEM" readonly></div>
                    <div class="panel-body">
                        <textarea class="value-input textarea-huge" id="perfil-historia" placeholder="Escreva a história do seu personagem..."></textarea>
                    </div>
                </section>
            </div>

            <!-- ABA: STATUS -->
            <div id="tab-status" class="tab-content">
                <div class="grid-layout">
                    <div class="col-left">
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="RECURSOS DE COMBATE" readonly></div>
                            <div class="panel-body combat-grid">
                                <div class="stat-box hp-box">
                                    <div class="visual-bar" id="vbar-hp"></div>
                                    <div class="stat-content">
                                        <input type="text" class="editable-label stat-label" value="Vida (HP)" readonly>
                                        <div class="stat-values">
                                            <input type="number" class="value-input number-input stat-curr sync-hp-curr" id="stat-hp-curr" value="10"> / 
                                            <input type="number" class="value-input number-input stat-max sync-hp-max calc-trigger" id="stat-hp-max" value="10">
                                        </div>
                                    </div>
                                </div>
                                <div class="stat-box pp-box">
                                    <div class="visual-bar" id="vbar-pp"></div>
                                    <div class="stat-content">
                                        <input type="text" class="editable-label stat-label" value="Poder (PP)" readonly>
                                        <div class="stat-values">
                                            <input type="number" class="value-input number-input stat-curr sync-pp-curr" id="stat-pp-curr" value="5"> / 
                                            <input type="number" class="value-input number-input stat-max sync-pp-max calc-trigger" id="stat-pp-max" value="5">
                                        </div>
                                    </div>
                                </div>
                                <div class="stat-box mp-box">
                                    <div class="visual-bar" id="vbar-mp"></div>
                                    <div class="stat-content">
                                        <input type="text" class="editable-label stat-label" value="Arcana (MP)" readonly>
                                        <div class="stat-values">
                                            <input type="number" class="value-input number-input stat-curr sync-mp-curr" id="stat-mp-curr" value="5"> / 
                                            <input type="number" class="value-input number-input stat-max sync-mp-max calc-trigger" id="stat-mp-max" value="5">
                                        </div>
                                    </div>
                                </div>
                                <div class="defense-grid">
                                    <div class="field"><input type="text" class="editable-label" value="Classe de Armadura:" readonly><input type="number" class="value-input number-input" id="combat-ca" value="10"></div>
                                    <div class="field"><input type="text" class="editable-label" value="Deslocamento:" readonly><input type="text" class="value-input" id="combat-deslocamento"></div>
                                    <div class="field"><input type="text" class="editable-label" value="Reações:" readonly><input type="number" class="value-input number-input" id="combat-reacoes" value="1"></div>
                                </div>
                                <textarea class="value-input textarea-large" id="combat-resistencias" placeholder="Resistências, Imunidades, Fraquezas..."></textarea>
                            </div>
                        </section>
                    </div>
                    <div class="col-right">
                        <section class="panel">
                            <div class="panel-header"><input type="text" class="editable-label" value="ATRIBUTOS E PERÍCIAS" readonly></div>
                            <div class="panel-body attrs-container" id="attributes-container">
                                <!-- Injetado via JS -->
                            </div>
                        </section>
                    </div>
                </div>
            </div>

            <!-- ABA: HABILIDADES -->
            <div id="tab-habilidades" class="tab-content dynamic-container">
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="-Habilidades Gerais-" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-large" id="text-habilidades-gerais"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="-Habilidades passivas-" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-large" id="text-habilidades-passivas"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="-Habilidades De Trilha-" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-large" id="text-habilidades-trilha"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="-Habilidades De Reação-" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-large" id="text-habilidades-reacao"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="-Habilidades da Raça-" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-large" id="text-habilidades-raca"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="-Habilidades da MARCA-" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-large" id="text-habilidades-marca"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="-Habilidades de Acampamento-" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-large" id="text-habilidades-acampamento"></textarea></div>
                </section>
                <div class="custom-fields-container"></div>
            </div>

            <!-- ABA: PODERES -->
            <div id="tab-poderes" class="tab-content dynamic-container">
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="-Poderes Gerais-" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-poderes-gerais"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="-Poderes Exclusivos-" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-poderes-exclusivos"></textarea></div>
                </section>
                <div class="custom-fields-container"></div>
            </div>

            <!-- ABA: MAGIAS -->
            <div id="tab-magias" class="tab-content dynamic-container">
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Truques (Nível 0)" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l0"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Nível 1" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l1"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Nível 2" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l2"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Nível 3" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l3"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Nível 4" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l4"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Nível 5" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l5"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Nível 6" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l6"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Nível 7" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l7"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Nível 8" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l8"></textarea></div>
                </section>
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="Nível 9" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-magias-l9"></textarea></div>
                </section>
                <div class="custom-fields-container"></div>
            </div>

            <!-- ABA: RITUAIS -->
            <div id="tab-rituais" class="tab-content dynamic-container">
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="RITUAIS" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-rituais" placeholder="Descreva rituais místicos..."></textarea></div>
                </section>
                <div class="custom-fields-container"></div>
            </div>

            <!-- ABA: TRANSFORMACOES -->
            <div id="tab-transformacoes" class="tab-content dynamic-container">
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="TRANSFORMAÇÕES" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-transformacoes" placeholder="Formas alternativas, Besta, Licantropia, etc..."></textarea></div>
                </section>
                <div class="custom-fields-container"></div>
            </div>

            <!-- ABA: PACTOS -->
            <div id="tab-pactos" class="tab-content dynamic-container">
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="PACTOS" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body"><textarea class="value-input textarea-huge" id="text-pactos" placeholder="Pactos com entidades, dívidas, etc..."></textarea></div>
                </section>
                <div class="custom-fields-container"></div>
            </div>
            
            <!-- ABA: INVENTÁRIO -->
            <div id="tab-inventario" class="tab-content dynamic-container">
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="INVENTÁRIO E EQUIPAMENTO" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body">
                        <div class="encumbrance-bar">
                            <input type="text" class="editable-label" value="Carga Max:" readonly>
                            <span class="calc-value" id="calc-carga-max">5</span>
                            <span class="helper-text">(5 + Força + Vigor)</span>
                        </div>
                        <div class="grid-layout">
                            <div class="slots-grid">
                                <div class="slot-field"><input type="text" class="editable-label" value="Cabeça (0/1):" readonly><input type="text" class="value-input slot-input" id="inv-cabeca"></div>
                                <div class="slot-field"><input type="text" class="editable-label" value="Olhos (0/2):" readonly><input type="text" class="value-input slot-input" id="inv-olhos"></div>
                                <div class="slot-field"><input type="text" class="editable-label" value="Orelhas (0/2):" readonly><input type="text" class="value-input slot-input" id="inv-orelhas"></div>
                                <div class="slot-field"><input type="text" class="editable-label" value="Pescoço (0/3):" readonly><input type="text" class="value-input slot-input" id="inv-pescoco"></div>
                                <div class="slot-field"><input type="text" class="editable-label" value="Tronco (0/1):" readonly><input type="text" class="value-input slot-input" id="inv-tronco"></div>
                                <div class="slot-field"><input type="text" class="editable-label" value="Corpo (0/3):" readonly><input type="text" class="value-input slot-input" id="inv-corpo"></div>
                                <div class="slot-field"><input type="text" class="editable-label" value="Pulso (0/4):" readonly><input type="text" class="value-input slot-input" id="inv-pulso"></div>
                                <div class="slot-field"><input type="text" class="editable-label" value="Mãos (0/2):" readonly><input type="text" class="value-input slot-input" id="inv-maos"></div>
                                <div class="slot-field"><input type="text" class="editable-label" value="Pés (0/1):" readonly><input type="text" class="value-input slot-input" id="inv-pes"></div>
                            </div>
                            <div>
                                <div class="inventory-box">
                                    <input type="text" class="editable-label" value="Mochila / Itens Livres:" readonly>
                                    <textarea class="value-input textarea-huge" id="inv-mochila" placeholder="Escreva aqui seus itens..."></textarea>
                                </div>
                                <div class="wallet-grid">
                                    <div class="wallet-item"><input type="text" class="editable-label" value="Créditos:" readonly><input type="number" class="value-input number-input" id="coin-creditos" value="0"></div>
                                    <div class="wallet-item"><input type="text" class="editable-label" value="Prata:" readonly><input type="number" class="value-input number-input" id="coin-prata" value="0"></div>
                                    <div class="wallet-item"><input type="text" class="editable-label" value="Ouro:" readonly><input type="number" class="value-input number-input" id="coin-ouro" value="0"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <div class="custom-fields-container"></div>
            </div>

            <!-- ABA: DIARIO -->
            <div id="tab-diario" class="tab-content dynamic-container">
                <section class="panel accordion">
                    <div class="panel-header accordion-header"><input type="text" class="editable-label" value="DIÁRIO E ANOTAÇÕES" readonly> <span class="acc-icon">▼</span></div>
                    <div class="panel-body accordion-body">
                        <textarea class="value-input textarea-huge" id="text-diario" placeholder="Anotações da campanha..."></textarea>
                    </div>
                </section>
                <div class="custom-fields-container"></div>
            </div>
            
        </main>
    </div>
    <script src="script.js?v=3"></script>
</body>
</html>
